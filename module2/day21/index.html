<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Signup Form</title>
<style>
    body {
    font-family: Arial, sans-serif;
    max-width: 450px;
    margin: 40px auto;
    padding: 0 20px;
    }

    .form-group {
    margin-bottom: 15px;
    }

    label {
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
    }

    input {
    width: 100%;
    padding: 8px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 4px;
    }

    button {
    width: 100%;
    padding: 10px;
    background-color: #0056b3;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 16px;
    cursor: pointer;
    }

    button:hover {
    background-color: #003d80;
    }

    #error-area {
    color: #d9534f;
    margin-top: 15px;
    font-weight: bold;
    min-height: 20px;
    }

    .stats {
    margin-top: 25px;
    padding: 12px;
    background-color: #f4f4f4;
    border-radius: 4px;
    }
</style>
</head>
<body>

<h2>Sign Up</h2>

<form id="signup-form">
    <div class="form-group">
    <label for="name">Full Name</label>
    <input type="text" id="name" placeholder="Enter full name" />
    </div>

    <div class="form-group">
    <label for="phone">Phone Number</label>
    <input type="text" id="phone" placeholder="0912345678 or +251912345678" />
    </div>

    <button type="submit">Submit</button>
</form>

<div id="error-area"></div>

<div class="stats">
    <p>Total Registered Users: <strong id="signup-count">0</strong></p>
</div>

<script src="app.js"></script>
</body>
</html>
