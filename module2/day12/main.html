<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Habesha Eatery | Bole, Addis</title>
<meta name="description" content="Authentic ETHIOPIAN traditional cuisine in the heart of Bole, Addis Ababa.">
</head>
<body>
<header>
    <h1>Habesha Eatery</h1>
    <nav>
    <a href="/reserve">Reserve</a><br><br>
    <a href="/menu">Menu</a><br><br>
    <a href="/location">Find Us</a><br><br>
    </nav>
</header>

<main>
    <section id="hero">
    <figure>
        <img src="ethiopian-food.jpg" alt="Traditional Ethiopian meal served with injera" width="700" height="400">
        <figcaption>Experience special Ethiopian flavors in skylight international hotel.</figcaption>
    </figure>
    </section>

    <section id="reserve">
    <h2>Reserve a Table</h2>
    <form action="/reserve" method="post">
        <fieldset>
        <legend>Your Details</legend>
        <label for="name">Full Name</label>
        <input id="name" name="name" type="text" required><br>

        <label for="phone">Phone</label>
        <input id="phone" name="phone" type="tel" required><br>
        </fieldset>

        <fieldset>
        <legend>Booking</legend><br>
        <label for="guests">Guests</label>
        <input id="guests" name="guests" type="number" min="1" max="20" required><br>

        <label for="date">Date</label>
        <input id="date" name="date" type="date" required><br>

        <label for="branch">Branch</label><br>
        <select id="branch" name="branch">
            <option>Bole</option>
            <option>Kazanchis</option>
        </select>
        </fieldset>

        <button type="submit">Reserve</button><br>
    </form>
    </section>

    <section id="menu"><br><br>
    <h2>Our Menu</h2>
    <table>
        <caption>Habesha Eatery Menu</caption><br><br>
        <thead>
        <tr>
            <th scope="col">Dish</th>
            <th scope="col">Price (ETB)</th>
        </tr>
        </thead>
        <tbody>
        <tr><th scope="row">KITFO</th><td>3200</td></tr>
        <tr><th scope="row">TIBS FIRFIR</th><td>2800</td></tr>
        <tr><th scope="row">KIKIL</th><td>2500</td></tr>
        <tr><th scope="row">SPECIAL KURT</th><td>4000</td></tr>
        </tbody>
    </table>
    </section>

    <section id="location"><br>
    <h2>Find Us</h2><br><br>
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3940.8255022165117!2d38.78705007352793!3d8.988199289629355!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x164b857cfb2ac12b%3A0xffd6a3d6def991b3!2sSKYLIGHT%20HOTEL%20GRAND%20BALLROOM%20(ABYSSINIA)!5e0!3m2!1sen!2set!4v1786062818839!5m2!1sen!2set" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </section>
</main>

<footer>
    <p>© 2026 Habesha Eatery · Bole, Addis Ababa · Open daily 10 AM – 10 PM</p>
</footer>
</body>
</html>
